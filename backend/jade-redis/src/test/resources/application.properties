# ========================================
# Jade Redis 模块 - 测试配置
# ========================================

# 关闭 dev services（用本地 Redis）
quarkus.redis.devservices.enabled=false
quarkus.redis.hosts=redis://localhost:6380

# 测试日志
quarkus.log.level=INFO
quarkus.log.category."com.jade.redis".level=DEBUG
quarkus.log.category."org.testcontainers".level=OFF
