quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/jade_ldap?currentSchema=public}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none
quarkus.redis.hosts=redis://localhost:6381
quarkus.http.test-port=0

jade.jwt.secret=test-only-jwt-secret-min-32-bytes-required-please-ok
jade.jwt.issuer=jade-ldap
jade.jwt.expire-seconds=7200
jade.crypto.master-key=0123456789abcdef0123456789abcdef

mp.jwt.verify.issuer=jade-ldap
jade.ldap.server.listen-address=127.0.0.1
jade.ldap.server.port=0
jade.ldap.server.base-dn=dc=jade,dc=test
jade.ldap.server.admin-dn=cn=admin,dc=jade,dc=test
jade.ldap.server.admin-password=test-admin-password
jade.ldap.server.data-file=target/test-directory.ldif
