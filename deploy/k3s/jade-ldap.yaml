apiVersion: v1
kind: Namespace
metadata:
  name: jade-ldap
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jade-ldap
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: jade-ldap
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: jade_ldap
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jade-ldap-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d jade_ldap"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d jade_ldap"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: jade-ldap
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: jade-ldap
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jade-ldap
  namespace: jade-ldap
spec:
  type: NodePort
  selector:
    app: jade-ldap
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31080
    - name: ldap
      port: 1389
      targetPort: ldap
      nodePort: 31389
    - name: ldaps
      port: 1636
      targetPort: ldaps
      nodePort: 31636
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jade-ldap
  namespace: jade-ldap
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: jade-ldap
  template:
    metadata:
      labels:
        app: jade-ldap
    spec:
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: jade-ldap
          image: 192.168.199.224:30030/reqpilot-admin/jade-ldap-server:b76fbd638e800e17bb6aefba2fedfc5adefd22ad
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: ldap
              containerPort: 1389
            - name: ldaps
              containerPort: 1636
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/jade_ldap?currentSchema=public
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jade-ldap-secrets
                  key: postgres-password
            - name: REDIS_URL
              value: redis://redis:6379
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jade-ldap-secrets
                  key: ldap-admin-password
            - name: JADE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jade-ldap-secrets
                  key: jwt-secret
            - name: JADE_JWT_EXPIRE_SECONDS
              value: "7200"
            - name: JADE_JWT_ISSUER
              value: jade-ldap
            - name: JADE_CRYPTO_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: jade-ldap-secrets
                  key: crypto-master-key
            - name: LDAPS_ENABLED
              value: "true"
            - name: LDAP_STARTTLS_ENABLED
              value: "true"
            - name: LDAPS_SELF_SIGNED
              value: "false"
            - name: LDAPS_KEY_STORE_PATH
              value: /etc/jade-ldap-tls/ldap-keystore.jks
            - name: LDAPS_KEY_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jade-ldap-secrets
                  key: tls-keystore-password
            - name: LDAP_CERTIFICATE_RELOAD_SECONDS
              value: "15"
            - name: LDAP_STORAGE_SYNC_INTERVAL_MILLIS
              value: "1000"
            - name: LDAP_MAX_CONNECTIONS
              value: "1000"
            - name: LDAP_DATA_FILE
              value: /tmp/directory.ldif
          startupProbe:
            httpGet: {path: /q/health, port: http}
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /q/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /q/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: tls
              mountPath: /etc/jade-ldap-tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: jade-ldap-tls
---
apiVersion: v1
kind: Service
metadata:
  name: jade-ldap-frontend
  namespace: jade-ldap
spec:
  type: NodePort
  selector:
    app: jade-ldap-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30173
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jade-ldap-frontend
  namespace: jade-ldap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jade-ldap-frontend
  template:
    metadata:
      labels:
        app: jade-ldap-frontend
    spec:
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: frontend
          image: 192.168.199.224:30030/reqpilot-admin/jade-ldap-frontend:b76fbd638e800e17bb6aefba2fedfc5adefd22ad
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
