name: CI

# 全 workflow 默认最小权限
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    # 单独给 backend job 加 contents: write, 让 "Post mvn log on failure" 能贴 commit comment
    permissions:
      contents: write
    env:
      # demo 模块的 DB (生产用 jade, CI 也用 jade 让 demo 测试一致)
      DB_URL: jdbc:postgresql://localhost:5432/jade_demo
      # admin 模块的 DB (跟 demo 完全独立)
      TEST_DB_URL: jdbc:postgresql://localhost:5432/jade_admin
      QUARKUS_REDIS_HOSTS: redis://localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # POSTGRES_DB 是主库 (jade-demo 用)
          # 额外业务库 (jade_admin) + 兼容库 (jade) 由 build 前 step 用 psql 创
          # 原因: 挂 init script volume 会把源文件 ownership 改成 root, checkout 删不动
          POSTGRES_DB: jade_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # 不加 healthcheck (pg_isready 跟 init race, 之前坑过; GHA 默认等端口 listen)
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Create additional databases
        # 官方 postgres 镜像不支持 POSTGRES_MULTIPLE_DATABASES, 挂 init volume 又会让 checkout 删不动
        # 用 postgresql-client 直接建库最稳
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d jade_demo -c "CREATE DATABASE jade_admin;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d jade_demo -c "CREATE DATABASE jade;"
      - name: Build & Test
        run: |
          cd backend
          # 跑单测 + 编译所有模块
          # 集成测试需要 PG/Redis，本地 CI 用 testcontainers
          mvn -B clean verify -DskipITs -Dmaven.test.failure.ignore=false 2>&1 | tee /tmp/mvn-build.log
          MAVEN_EXIT=${PIPESTATUS[0]}
          echo "maven exit code: $MAVEN_EXIT"
          # 出错时把 tail 写到 step log, 方便 annotation
          if [ "$MAVEN_EXIT" -ne 0 ]; then
            echo "::group::maven build log (tail 200)"
            tail -200 /tmp/mvn-build.log
            echo "::endgroup::"
            exit "$MAVEN_EXIT"
          fi
      - name: Post mvn log to commit on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/mvn-build.log', 'utf8');
            // grab the FAILURES section + last 100 lines for compactness
            const tail = log.split('\n').slice(-200).join('\n');
            const failuresIdx = log.indexOf('Failed tests:');
            const failSection = failuresIdx >= 0 ? log.substring(failuresIdx, failuresIdx + 4000) : '';
            const body = `## mvn build failed\n\n\`\`\`\n${tail.slice(0, 30000)}\n\`\`\`` +
              (failSection ? `\n\n### Failed tests\n\`\`\`\n${failSection.slice(0, 6000)}\n\`\`\`` : '');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci --no-audit --no-fund
      - name: Type check
        run: cd frontend && npm run type-check
      - name: Build
        run: cd frontend && npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  publish:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # docker-container snapshotter 加速 native build (支持 mount)
          # 默认 driver 是 docker, 不支持 mount, GraalVM 会失败
          driver-opts: image=moby/buildkit:latest
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract LDAP server image metadata
        id: server-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shocktide1688/jade-ldap/server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest-native,enable={{is_default_branch}}
      - name: Build and push LDAP native server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ldap
          platforms: linux/amd64
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          cache-from: type=gha,scope=jade-ldap-native
          cache-to: type=gha,mode=max,scope=jade-ldap-native
      - name: Extract frontend Docker metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shocktide1688/jade-ldap/jade-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=jade-ldap-frontend
          cache-to: type=gha,mode=max,scope=jade-ldap-frontend

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
